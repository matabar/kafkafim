# Local Kubernetes demo only (deploy/local/README.md): one single-node Kafka broker and one
# single-node Elasticsearch, as plain Deployments with no persistence. Production points the
# chart at existing clusters; charts/kafkafim never deploys these (ADR-0015).
#
# Both read their credentials from the Secrets that demo.sh creates (kafka-demo-kafkafim,
# es-demo-kafkafim). kafkafim mounts the same Secrets as configtree files, so the broker,
# Elasticsearch and kafkafim agree on one randomly generated password each.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kafkafim-demo }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: client, port: 9092, targetPort: client }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kafkafim-demo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kafkafim-demo }
    spec:
      # A Service named "kafka" would inject KAFKA_PORT etc., which the image would turn
      # into broker properties.
      enableServiceLinks: false
      containers:
        - name: kafka
          # JVM image: the native image cannot authenticate SASL clients.
          image: apache/kafka:4.1.0
          ports:
            - { name: client, containerPort: 9092 }
          env:
            - name: KAFKAFIM_USERNAME
              valueFrom: { secretKeyRef: { name: kafka-demo-kafkafim, key: username } }
            - name: KAFKAFIM_PASSWORD
              valueFrom: { secretKeyRef: { name: kafka-demo-kafkafim, key: password } }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093" }
            # CLIENT: SASL/PLAIN for kafkafim, through the Service. INTERNAL: plaintext on
            # loopback only, for the broker itself and the demo's kubectl exec tooling.
            - name: KAFKA_LISTENERS
              value: "CLIENT://0.0.0.0:9092,INTERNAL://127.0.0.1:19092,CONTROLLER://127.0.0.1:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "CLIENT://kafka:9092,INTERNAL://127.0.0.1:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CLIENT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS, value: PLAIN }
            - name: KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG
              value: >-
                org.apache.kafka.common.security.plain.PlainLoginModule required
                user_$(KAFKAFIM_USERNAME)="$(KAFKAFIM_PASSWORD)";
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }   # as in production (ADR-0021)
            - { name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m" }
          readinessProbe:
            tcpSocket: { port: client }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: kafkafim-demo }
spec:
  selector: { app.kubernetes.io/name: elasticsearch }
  ports:
    - { name: http, port: 9200, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: kafkafim-demo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: elasticsearch }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elasticsearch, app.kubernetes.io/part-of: kafkafim-demo }
    spec:
      enableServiceLinks: false
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
          ports:
            - { name: http, containerPort: 9200 }
          env:
            # Security on (kafkafim authenticates with basic auth, as against production),
            # TLS off to keep the demo small. The elastic superuser stands in for a
            # provisioned writer role.
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: es-demo-kafkafim, key: password } }
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "false" }
            - { name: xpack.security.transport.ssl.enabled, value: "false" }
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS -u "elastic:$ELASTIC_PASSWORD" 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 1Gi }
