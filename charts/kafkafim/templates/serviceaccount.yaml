{{- include "kafkafim.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kafkafim.serviceAccountName" . }}
  labels:
    {{- include "kafkafim.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# kafkafim never talks to the Kubernetes API.
automountServiceAccountToken: false
