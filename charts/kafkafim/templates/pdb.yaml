{{- include "kafkafim.validate" . -}}
{{- range $g, $group := .Values.groups }}
{{- /* A group without its own pdb whose replica floor is 1 (allowSingleReplica) gets
       maxUnavailable: 1, since the top-level minAvailable: 1 would block every drain. */}}
{{- $floor := ternary (include "kafkafim.minReplicas" $group) (include "kafkafim.replicas" $group) (eq (include "kafkafim.autoscalingEnabled" $group) "true") | int }}
{{- $pdb := $group.pdb | default (ternary (dict "maxUnavailable" 1) $.Values.pdb (lt $floor 2)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kafkafim.groupName" (dict "root" $ "group" $g) }}
  labels:
    {{- include "kafkafim.groupLabels" (dict "root" $ "group" $g) | nindent 4 }}
spec:
  {{- if not (kindIs "invalid" $pdb.maxUnavailable) }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else if not (kindIs "invalid" $pdb.minAvailable) }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "kafkafim.groupSelectorLabels" (dict "root" $ "group" $g) | nindent 6 }}
{{- end }}
