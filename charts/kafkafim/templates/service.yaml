{{- include "kafkafim.validate" . -}}
{{- range $g, $group := .Values.groups }}
---
# Actuator only: health, Prometheus scrape, /actuator/reload. In-cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafkafim.groupName" (dict "root" $ "group" $g) }}
  labels:
    {{- include "kafkafim.groupLabels" (dict "root" $ "group" $g) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kafkafim.groupSelectorLabels" (dict "root" $ "group" $g) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
