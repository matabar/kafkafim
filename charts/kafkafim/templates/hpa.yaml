{{- include "kafkafim.validate" . -}}
{{- range $g, $group := .Values.groups }}
{{- if include "kafkafim.autoscalingEnabled" $group }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kafkafim.groupName" (dict "root" $ "group" $g) }}
  labels:
    {{- include "kafkafim.groupLabels" (dict "root" $ "group" $g) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kafkafim.groupName" (dict "root" $ "group" $g) }}
  minReplicas: {{ include "kafkafim.minReplicas" $group }}
  maxReplicas: {{ int $group.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ int ($group.autoscaling.targetCPUUtilizationPercentage | default 70) }}
{{- end }}
{{- end }}
