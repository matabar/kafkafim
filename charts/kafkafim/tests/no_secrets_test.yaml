suite: the chart never renders a Secret
# Glob: a template added later is covered without editing this suite.
templates:
  - templates/*.yaml
release:
  name: kafkafim
set:
  networkPolicy.enabled: true
  serviceMonitor.enabled: true
tests:
  - it: renders no Secret with the minimal CI values
    values: [../ci/minimal-values.yaml]
    asserts:
      - isKind: { of: Secret }
        not: true
  - it: renders no Secret with the two-groups CI values
    values: [../ci/two-groups-values.yaml]
    asserts:
      - isKind: { of: Secret }
        not: true
  - it: renders no Secret with the hpa CI values
    values: [../ci/hpa-values.yaml]
    asserts:
      - isKind: { of: Secret }
        not: true
  - it: renders no Secret with the network-policy CI values
    values: [../ci/network-policy-values.yaml]
    asserts:
      - isKind: { of: Secret }
        not: true
