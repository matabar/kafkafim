spring:
  application:
    name: kafkafim
  main:
    web-application-type: servlet   # only for actuator + reload endpoint; no business endpoints
  profiles:
    default: local                  # development sample in application-local.yaml; production sets
                                    # SPRING_PROFILES_ACTIVE=kafkafim, which disables this default
  lifecycle:
    timeout-per-shutdown-phase: 60s # flush in-flight bulks and commit before the pod is killed

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,reload
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: when-authorized
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
  tracing:
    sampling:
      probability: 0.01
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    resource-attributes:
      service.namespace: kafkafim

logging:
  structured:
    format:
      console: ecs
