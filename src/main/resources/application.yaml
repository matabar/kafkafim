spring:
  application:
    name: kafkafim
  main:
    web-application-type: servlet   # only for actuator + reload endpoint; no business endpoints
  profiles:
    default: local                  # development sample in application-local.yaml; production sets
                                    # SPRING_PROFILES_ACTIVE=kafkafim, which disables this default
  lifecycle:
    timeout-per-shutdown-phase: 60s # per SmartLifecycle phase, not on the whole shutdown. Higher phases stop
                                    # first: the pipeline supervisor (phase MAX-100) drains every pipeline's
                                    # source (<= 30s + 10s, committing what completed), then closes its bulk
                                    # sinks (<= 10s); the DLQ producers (MAX-1000) flush (<= 10s); then the
                                    # web server drains (MAX-1024, instant for actuator-only traffic). The
                                    # 60s supervisor phase must fit the pod's 90s grace period.

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,reload   # reload: POST /actuator/reload (DESIGN §5.6)
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,supervisor   # process alive, supervisor running (DESIGN §10)
        readiness:
          include: readinessState,pipelines,kafka # >= 1 pipeline runs, Kafka clients connected;
                                                  # never Elasticsearch (DESIGN §4.6, §10)
      show-components: always
      show-details: when-authorized
  # OTLP export headers are not set here. Spring Boot maps OTEL_EXPORTER_OTLP_HEADERS onto
  # both exporters' headers maps, and the chart mounts secret headers (otel.secretHeaders)
  # as configtree files at those maps' property paths (docs/HELM.md).
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
        base-time-unit: seconds     # Micrometer's OTLP default is milliseconds; seconds keeps the OTLP names
                                    # and units equal to /actuator/prometheus (kafkafim_e2e_latency_seconds),
                                    # which deploy/grafana/ queries (DESIGN §10)
  tracing:
    sampling:
      probability: 0.01             # 1% of pipeline.batch traces; failed batches are always kept
                                    # (telemetry/BatchSampler, ADR-0029)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    resource-attributes:            # on both OTLP metrics and traces; these win over OTEL_RESOURCE_ATTRIBUTES
      service.namespace: kafkafim
      service.instance.id: ${POD_NAME:${HOSTNAME:localhost}}   # per-pod OTLP identity (the backend's
                                    # `instance`): the chart sets POD_NAME from the downward API; a plain
                                    # container has HOSTNAME; a local run without either is `localhost`

kafkafim:
  reload:                           # hot reload of the config and secret directories (DESIGN §5.6);
    enabled: true                   # read at startup only. The watched paths are the file and
    poll-interval: 10s              # configtree locations of spring.config.(additional-)location and
    debounce: 2s                    # spring.config.import. POST /actuator/reload works regardless.

logging:
  structured:
    format:
      console: ecs
