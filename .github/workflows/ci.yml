name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a pull request cancels its older run. On main every merged commit gets its
# own complete run (docs/DELIVERY.md): a per-commit group, never cancelled. With one group for
# main, a run still in progress would survive (cancel-in-progress false) but a pending one
# would still be replaced by the next merge, leaving that commit without an image build.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Decides which gate jobs a pull request needs (docs/DELIVERY.md, "Docs-only pull requests").
  # Skipped jobs report success, so the check names stay usable as required checks; a
  # workflow-level paths-ignore would leave them pending instead. Fails open: if this job
  # fails, its outputs are empty and every job below runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      helm: ${{ steps.diff.outputs.helm }}
      grafana: ${{ steps.diff.outputs.grafana }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the PR merge commit and its first parent, the base branch tip
      - id: diff
        name: Classify changed paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            # Pushes to main run everything.
            printf 'docs_only=false\nhelm=true\ngrafana=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # What merging the PR would change. --no-renames lists both sides of a rename, so
          # renaming code to *.md is not docs-only. quotePath=false keeps non-ASCII paths unquoted;
          # git still quotes a path containing a control character (tab, newline, ...), " or \
          # ("docs/a\tb.md"). It then matches no docs pattern and counts as non-docs (the safe
          # side: build, integration and image run), but it matches no helm or grafana pattern.
          git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          sed 's/^/  /' "$RUNNER_TEMP/changed"
          docs_only=false helm=false grafana=false
          [ -s "$RUNNER_TEMP/changed" ] && docs_only=true
          while IFS= read -r f; do
            case "$f" in
              src/*) docs_only=false ;;   # Maven packages src/main/resources, *.md included
              *.md | docs/* | LICENSE) ;;
              *) docs_only=false ;;
            esac
            case "$f" in
              charts/* | .github/workflows/ci.yml | .github/keys/*) helm=true ;;
            esac
            case "$f" in
              deploy/grafana/* | .github/workflows/ci.yml) grafana=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "docs_only=$docs_only helm=$helm grafana=$grafana"
          printf 'docs_only=%s\nhelm=%s\ngrafana=%s\n' "$docs_only" "$helm" "$grafana" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      # Integration tests run in the parallel `integration` job, so `image` can start sooner.
      - name: Style, unit and architecture tests
        run: ./mvnw -B -ntp verify -DskipITs
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Application jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

  # Failsafe only (*IntegrationTest, Testcontainers), in parallel with `build`. `build` already
  # runs Spotless, Checkstyle and Surefire on the same commit, so they are skipped here.
  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Starts pulling every Testcontainers image named in src/test while Java is set up and
      # Maven compiles. No wait: a container start that needs an image still being pulled joins
      # the daemon's in-flight pull. A failed pull only warns; Testcontainers pulls again.
      # Testcontainers' own ryuk image (2 MB) is not named in src/test and is left to it.
      - name: Pre-pull Testcontainers images
        shell: bash
        run: |
          images=$(grep -rhoE 'DockerImageName\.parse\("[^"]+"\)' src/test | sed -E 's/^.*\("([^"]+)"\)$/\1/' | sort -u) || true   # no match: warn below
          if [ -z "$images" ]; then echo "::warning::no DockerImageName.parse(\"...\") found in src/test"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/pulls"
          for i in $images; do
            log="$RUNNER_TEMP/pulls/$(echo "$i" | tr '/:' '__').log"
            echo "pulling $i"
            # Detached from the step's output, so the step ends while the pulls go on.
            ( start=$(date +%s)
              if docker pull -q "$i"; then echo "ok $i $(( $(date +%s) - start ))s"; else echo "FAILED $i"; fi
            ) > "$log" 2>&1 < /dev/null &
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Integration tests
        run: >-
          ./mvnw -B -ntp verify
          -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
      - name: Image pre-pull results
        if: always()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/pulls/*.log; do
            [ -e "$f" ] || continue
            tail -n 1 "$f"
            if grep -q '^FAILED' "$f"; then echo "::warning::pre-pull failed: $(cat "$f")"; fi
          done
      - name: Integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore

  # Needs only `build` (the jar), so it runs while `integration` is still running. Both are
  # required checks (docs/DELIVERY.md), so a pull request cannot merge with either failing.
  image:
    name: Container image
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target/
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kafkafim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the image
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp -p 8080:8080 kafkafim:ci \
            --spring.docker.compose.enabled=false \
            --management.otlp.metrics.export.enabled=false \
            --management.tracing.export.otlp.enabled=false)
          for _ in $(seq 1 30); do
            if curl -sf localhost:8080/actuator/health/liveness; then
              echo; docker rm -f "$cid" >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "container did not become live"; docker logs "$cid"; docker rm -f "$cid" >/dev/null; exit 1

  # Also checks the Grafana dashboards and Prometheus alert rules under deploy/grafana/, so the
  # set of required checks stays the same. Each half runs only when its paths changed.
  helm:
    name: Helm chart
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.helm != 'false' || needs.changes.outputs.grafana != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Chart present and changed?
        id: chart
        env:
          HELM_CHANGED: ${{ needs.changes.outputs.helm }}
        run: |
          if [ "$HELM_CHANGED" != false ] && [ -f charts/kafkafim/Chart.yaml ]; then exists=true; else exists=false; fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1   # helm-unittest 1.2.1 supports Helm >= 4.3; keep ci.yml and release.yml in step
      - if: steps.chart.outputs.exists == 'true'
        run: helm lint charts/kafkafim
      # Third-party chart tools are pinned and cached so an outage of github.com release
      # downloads or of the Go module proxy cannot fail the gate once the cache is warm.
      # The key changes with every pin below; a cache is only saved by a passing job.
      - if: steps.chart.outputs.exists == 'true'
        name: Restore chart tools cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chart-tools
          key: chart-tools-${{ runner.os }}-${{ runner.arch }}-kubeconform-v0.8.0-helm-unittest-1.2.1-bbcebd42
      - if: steps.chart.outputs.exists == 'true'
        name: Template and validate against Kubernetes schemas
        shell: bash
        env:
          TOOLS: ${{ runner.temp }}/chart-tools
        run: |
          shopt -s nullglob
          files=(charts/kafkafim/ci/*-values.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no charts/kafkafim/ci/*-values.yaml; add at least one" >&2; exit 1; fi
          # go install verifies the module against sum.golang.org; the cached binary skips the proxy.
          [ -x "$TOOLS/bin/kubeconform" ] || GOBIN="$TOOLS/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          "$TOOLS/bin/kubeconform" -v >/dev/null   # smoke test only: a go-install build reports "development"
          for v in "${files[@]}"; do
            helm template kafkafim charts/kafkafim -f "$v" | "$TOOLS/bin/kubeconform" -strict -summary
          done
      - if: steps.chart.outputs.exists == 'true'
        name: Chart unit tests
        shell: bash
        env:
          ASSET_TOKEN: ${{ github.token }}   # unset after the downloads, before any plugin code runs
          TOOLS: ${{ runner.temp }}/chart-tools
          # helm-unittest 1.2.1: the signed all-platform plugin tarball, its provenance file
          # (release asset ids are immutable), their SHA-256 and the release key's fingerprint.
          # The key is .github/keys/helm-unittest-public-key.asc, copied from the v1.2.1 tag; it
          # expires 2028-05-06, so re-copy it from upstream before then. A version bump changes
          # the asset ids, both SHA-256s and the cache key above.
          TGZ: unittest-1.2.1.tgz
          TGZ_ASSET: '607406094'
          TGZ_SHA256: bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f
          PROV_ASSET: '607406098'
          PROV_SHA256: 23833d293bd575b552312e17e0c1900199857a327b44d7a1b6a25811b1514bbd
          KEY_FPR: 853008CD0B0A5A2DA04FF8A5616AD47F65B54AC7
        run: |
          d="$TOOLS/helm-unittest"
          mkdir -p "$d"
          # github.com/.../releases/download/ has returned 504 for hours while the API
          # asset endpoint kept serving, so fetch through the API with the job token.
          fetch() {
            [ -s "$d/$1" ] && return 0
            for i in 1 2 3 4 5; do
              if GH_TOKEN="$ASSET_TOKEN" gh api -H 'Accept: application/octet-stream' "repos/helm-unittest/helm-unittest/releases/assets/$2" > "$d/$1.part"; then
                mv "$d/$1.part" "$d/$1"; return 0
              fi
              echo "download of $1 failed (attempt $i)" >&2; [ "$i" -lt 5 ] && sleep $((i * 10))
            done
            return 1
          }
          fetch "$TGZ" "$TGZ_ASSET"
          fetch "$TGZ.prov" "$PROV_ASSET"
          unset ASSET_TOKEN
          printf '%s  %s\n' "$TGZ_SHA256" "$d/$TGZ" "$PROV_SHA256" "$d/$TGZ.prov" | sha256sum -c -
          GNUPGHOME=$(mktemp -d)   # short path: gpg's socket paths have a length limit
          export GNUPGHOME
          gpg --batch --no-autostart --quiet --import .github/keys/helm-unittest-public-key.asc
          fprs=$(gpg --batch --no-autostart --with-colons --list-keys | awk -F: '$1 == "pub" {p = 1; next} p && $1 == "fpr" {print $10; p = 0}')
          if [ "$fprs" != "$KEY_FPR" ]; then echo "unexpected key(s) in keyring: $fprs" >&2; exit 1; fi
          gpg --batch --no-autostart --export > "$RUNNER_TEMP/helm-unittest.gpg"   # Helm reads the legacy keyring format
          # Helm 4 checks the tarball against the signed .prov next to it.
          helm plugin install "$d/$TGZ" --keyring "$RUNNER_TEMP/helm-unittest.gpg"
          helm plugin list | grep -E '^unittest[[:space:]]+1\.2\.1[[:space:]].*[[:space:]]signed[[:space:]]'
          helm unittest charts/kafkafim
      # Same pinning as the chart tools: the Prometheus release tarball (promtool) is fetched
      # through the GitHub API asset endpoint, checked against a pinned SHA-256 on every run,
      # and cached under a key that changes with the pin.
      - if: needs.changes.outputs.grafana != 'false'
        name: Restore Grafana tools cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/grafana-tools
          key: grafana-tools-${{ runner.os }}-${{ runner.arch }}-prometheus-3.15.1-6a726885
      - if: needs.changes.outputs.grafana != 'false'
        name: Dashboards and alert rules
        shell: bash
        env:
          ASSET_TOKEN: ${{ github.token }}
          TOOLS: ${{ runner.temp }}/grafana-tools
          # Prometheus 3.15.1, linux-amd64; the SHA-256 matches the release's sha256sums.txt.
          # A version bump changes the asset id, the SHA-256 and the cache key above.
          TGZ: prometheus-3.15.1.linux-amd64.tar.gz
          TGZ_ASSET: '662697731'
          TGZ_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          shopt -s nullglob
          dashboards=(deploy/grafana/dashboards/*.json)
          cd deploy/grafana/alerts
          tests=(*.test.yaml)
          rules=()
          for f in *.yaml; do [[ "$f" == *.test.yaml ]] || rules+=("$f"); done
          cd - >/dev/null
          if [ ${#dashboards[@]} -eq 0 ] || [ ${#rules[@]} -eq 0 ] || [ ${#tests[@]} -eq 0 ]; then
            echo "expected deploy/grafana/dashboards/*.json, deploy/grafana/alerts/*.yaml and *.test.yaml" >&2; exit 1
          fi
          jq empty "${dashboards[@]}"
          echo "dashboards: ${dashboards[*]} parse"
          mkdir -p "$TOOLS"
          if [ ! -s "$TOOLS/$TGZ" ]; then
            for i in 1 2 3 4 5; do
              if GH_TOKEN="$ASSET_TOKEN" gh api -H 'Accept: application/octet-stream' "repos/prometheus/prometheus/releases/assets/$TGZ_ASSET" > "$TOOLS/$TGZ.part"; then
                mv "$TOOLS/$TGZ.part" "$TOOLS/$TGZ"; break
              fi
              echo "download of $TGZ failed (attempt $i)" >&2
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep $((i * 10))
            done
          fi
          unset ASSET_TOKEN
          printf '%s  %s\n' "$TGZ_SHA256" "$TOOLS/$TGZ" | sha256sum -c -
          tar -xzf "$TOOLS/$TGZ" -C "$RUNNER_TEMP" --strip-components=1 "${TGZ%.tar.gz}/promtool"
          promtool="$RUNNER_TEMP/promtool"
          "$promtool" --version
          cd deploy/grafana/alerts   # the tests name their rule_files relative to themselves
          "$promtool" check rules "${rules[@]}"
          "$promtool" test rules "${tests[@]}"
