name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Unit, integration and architecture tests
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
      - name: Application jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target/
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kafkafim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the image
        run: |
          cid=$(docker run -d --read-only --tmpfs /tmp -p 8080:8080 kafkafim:ci \
            --spring.docker.compose.enabled=false \
            --management.otlp.metrics.export.enabled=false \
            --management.otlp.tracing.export.enabled=false)
          for _ in $(seq 1 30); do
            if curl -sf localhost:8080/actuator/health/liveness; then
              echo; docker rm -f "$cid" >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "container did not become live"; docker logs "$cid"; docker rm -f "$cid" >/dev/null; exit 1

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Chart present?
        id: chart
        run: test -f charts/kafkafim/Chart.yaml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v5
      - if: steps.chart.outputs.exists == 'true'
        run: helm lint charts/kafkafim
      - if: steps.chart.outputs.exists == 'true'
        name: Template and validate against Kubernetes schemas
        shell: bash
        run: |
          shopt -s nullglob
          files=(charts/kafkafim/ci/*-values.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no charts/kafkafim/ci/*-values.yaml; add at least one" >&2; exit 1; fi
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          for v in "${files[@]}"; do
            helm template kafkafim charts/kafkafim -f "$v" | "$(go env GOPATH)/bin/kubeconform" -strict -summary
          done
      - if: steps.chart.outputs.exists == 'true'
        name: Chart unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1
          helm unittest charts/kafkafim
