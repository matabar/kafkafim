name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Unit, integration and architecture tests
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
      - name: Application jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          if-no-files-found: error

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target/
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kafkafim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-run the image
        run: docker run --rm kafkafim:ci --spring.profiles.active=validate --kafkafim.validate.exit-code-on-success=0 || echo "validate profile not implemented yet"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart present?
        id: chart
        run: test -f charts/kafkafim/Chart.yaml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v4
      - if: steps.chart.outputs.exists == 'true'
        run: helm lint charts/kafkafim
      - if: steps.chart.outputs.exists == 'true'
        name: Template and validate against Kubernetes schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          for v in charts/kafkafim/ci/*-values.yaml; do
            helm template kafkafim charts/kafkafim -f "$v" | "$(go env GOPATH)/bin/kubeconform" -strict -summary
          done
      - if: steps.chart.outputs.exists == 'true'
        name: Chart unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
          helm unittest charts/kafkafim
