name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write     # GitHub Release
  packages: write     # GHCR image + chart
  id-token: write     # Cosign keyless
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kafkafim"
            echo "chart_repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_OUTPUT"
          mkdir -p dist
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test at the tag
        run: ./mvnw -B -ntp -Drevision=${{ steps.ver.outputs.version }} verify

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4
      - name: Sign image
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ver.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: dist/kafkafim-${{ steps.ver.outputs.version }}.sbom.spdx.json
          upload-artifact: false
      - name: Save the signed image for the air gap
        # Pulls the exact pushed digest (all platforms) together with its Cosign signature
        # and attestations into an OCI layout, so the bundle carries what was signed.
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          cosign save --dir "dist/kafkafim-${V}-image" "${IMAGE}@${DIGEST}"
          echo "${IMAGE}@${DIGEST}" > "dist/kafkafim-${V}-image.digest"

      - name: Chart present?
        id: chart
        run: test -f charts/kafkafim/Chart.yaml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v5
      - if: steps.chart.outputs.exists == 'true'
        name: Package, push and sign chart
        env:
          V: ${{ steps.ver.outputs.version }}
          CHART_REPO: ${{ steps.ver.outputs.chart_repo }}
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/kafkafim --version "$V" --app-version "$V" -d dist
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/kafkafim-$V.tgz" "$CHART_REPO" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]*' push.log | head -1)
          cosign sign --yes "${CHART_REPO#oci://}/kafkafim@${DIGEST}"

      - name: Air-gap bundle
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ -f docs/DELIVERY.md ]; then
            sed "s/1\.2\.3/$V/g" docs/DELIVERY.md > dist/IMPORT.md
          else
            echo "Import instructions: see docs/DELIVERY.md in the repository." > dist/IMPORT.md
          fi
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp dist/SHA256SUMS
          tar -czf "kafkafim-$V-airgap.tar.gz" -C dist .
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            kafkafim-*-airgap.tar.gz
            dist/*.sbom.spdx.json
            dist/*.tgz
