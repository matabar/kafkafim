name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write     # GitHub Release
  packages: write     # GHCR image + chart
  id-token: write     # Cosign keyless
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kafkafim
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test at the tag
        run: ./mvnw -B -ntp -Drevision=${{ steps.ver.outputs.version }} verify

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export amd64 OCI archive for the air gap
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=dist/kafkafim-${{ steps.ver.outputs.version }}-image-amd64.tar
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: dist/kafkafim-${{ steps.ver.outputs.version }}.sbom.spdx.json
          upload-artifact: false

      - name: Chart present?
        id: chart
        run: test -f charts/kafkafim/Chart.yaml && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@v4
      - if: steps.chart.outputs.exists == 'true'
        name: Package, push and sign chart
        run: |
          V=${{ steps.ver.outputs.version }}
          helm package charts/kafkafim --version "$V" --app-version "$V" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push "dist/kafkafim-$V.tgz" "$CHART_REPO" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[a-f0-9]*' push.log | head -1)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/kafkafim@${DIGEST}"

      - name: Air-gap bundle
        run: |
          V=${{ steps.ver.outputs.version }}
          sed "s/1\.2\.3/$V/g" docs/DELIVERY.md > dist/IMPORT.md
          (cd dist && sha256sum ./* > SHA256SUMS)
          tar -czf "kafkafim-$V-airgap.tar.gz" -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kafkafim-*-airgap.tar.gz
            dist/*.sbom.spdx.json
            dist/*.tgz
